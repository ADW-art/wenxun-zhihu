name: wenxun-zhihu

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wenxun
      POSTGRES_USER: wenxun
      POSTGRES_PASSWORD: wenxun
    ports:
      - "5432:5432"
    volumes:
      - wenxun_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenxun -d wenxun"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wenxun_postgres:
