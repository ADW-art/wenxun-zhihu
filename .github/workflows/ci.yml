name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wenxun
          POSTGRES_USER: wenxun
          POSTGRES_PASSWORD: wenxun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wenxun -d wenxun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wenxun:wenxun@localhost:5432/wenxun?schema=public
      AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      AUTH_TRUST_HOST: "true"
      AGENT_PROVIDER: mock
      AGENT_MODEL: mock-conservation-agent
      APP_URL: http://localhost:3000
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
