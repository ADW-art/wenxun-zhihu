[mcp_servers.wenxun]
command = "node"
args = ["node_modules/tsx/dist/cli.mjs", "src/mcp/index.ts"]
cwd = "E:/code/项目/计算机应用大赛/智能体"
env_vars = [
  "DATABASE_URL",
  "AUTH_SECRET",
  "AGENT_PROVIDER",
